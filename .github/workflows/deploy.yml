name: CodeSkill CI/CD — Immutable ECR Build & Auto Scaling Rollout

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: 'Target service to build and deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - backend
      image_tag:
        description: 'Specific image tag to deploy or rollback to (leave blank for commit SHA)'
        required: false
        default: ''

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 239939507154.dkr.ecr.ap-south-1.amazonaws.com
  FRONTEND_REPO: codeskill-prod-frontend
  BACKEND_REPO: codeskill-prod-backend
  FRONTEND_ASG: codeskill-frontend-asg
  BACKEND_ASG: codeskill-backend-asg
  FRONTEND_TG: codeskill-prod-tg
  BACKEND_TG: codeskill-prod-be-tg

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Validation & Automated Tests (Fail-Fast)
  # ============================================================================
  test:
    name: Run Automated Tests & Type Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend-nestjs/package-lock.json
            frontend-v2/package-lock.json

      - name: Backend Tests & Build Verification
        working-directory: ./backend-nestjs
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npm test -- --maxWorkers=2

      - name: Frontend Tests & Build Verification
        working-directory: ./frontend-v2
        run: |
          npm ci --legacy-peer-deps
          npm test -- --maxWorkers=2
          npm run build

  # ============================================================================
  # 2. Build Immutable Docker Images & Push to Amazon ECR
  # ============================================================================
  build-and-push:
    name: Build & Push Immutable Docker Images
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      deployment_tag: ${{ steps.determine-tag.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Determine Deployment Tag
        id: determine-tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS Credentials (OIDC / Access Keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Docker Image
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'backend' || github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ./backend-nestjs
          file: ./backend-nestjs/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ steps.determine-tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Docker Image
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'frontend' || github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-v2
          file: ./frontend-v2/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ steps.determine-tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Rolling Auto Scaling Instance Refresh with Health Verification
  # ============================================================================
  rollout:
    name: Rolling Auto Scaling Rollout & Verification
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger Frontend Auto Scaling Rolling Refresh
        id: refresh-frontend
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'frontend' || github.event_name == 'push'
        run: |
          set -Eeuo pipefail
          asg="${{ env.FRONTEND_ASG }}"
          refresh_id=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$asg" --region "${{ env.AWS_REGION }}" --query 'InstanceRefreshes[?Status==`Pending` || Status==`InProgress`].InstanceRefreshId | [0]' --output text || echo "")
          if [[ -z "$refresh_id" || "$refresh_id" == "None" ]]; then
            echo "Initiating rolling instance refresh for ${asg}..."
            read -r lt_id lt_version < <(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$asg" --region "${{ env.AWS_REGION }}" --query 'AutoScalingGroups[0].LaunchTemplate.[LaunchTemplateId,Version]' --output text || true)
            if [[ -n "$lt_id" && -n "$lt_version" && "$lt_version" != "None" ]]; then
              desired=$(jq -cn --arg id "$lt_id" --arg version "$lt_version" '{LaunchTemplate:{LaunchTemplateId:$id,Version:$version}}')
              refresh_id=$(aws autoscaling start-instance-refresh \
                --auto-scaling-group-name "$asg" \
                --desired-configuration "$desired" \
                --preferences '{"MinHealthyPercentage": 50, "MaxHealthyPercentage": 150, "InstanceWarmup": 120, "SkipMatching": false, "AutoRollback": true}' \
                --region "${{ env.AWS_REGION }}" \
                --query 'InstanceRefreshId' --output text)
            else
              refresh_id=$(aws autoscaling start-instance-refresh \
                --auto-scaling-group-name "$asg" \
                --preferences '{"MinHealthyPercentage": 50, "MaxHealthyPercentage": 150, "InstanceWarmup": 120, "SkipMatching": false, "AutoRollback": false}' \
                --region "${{ env.AWS_REGION }}" \
                --query 'InstanceRefreshId' --output text)
            fi
          fi
          echo "Monitoring ${asg} refresh ${refresh_id}"
          echo "refresh_id=$refresh_id" >> "$GITHUB_OUTPUT"

      - name: Trigger Backend Auto Scaling Rolling Refresh
        id: refresh-backend
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'backend' || github.event_name == 'push'
        run: |
          set -Eeuo pipefail
          asg="${{ env.BACKEND_ASG }}"
          refresh_id=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$asg" --region "${{ env.AWS_REGION }}" --query 'InstanceRefreshes[?Status==`Pending` || Status==`InProgress`].InstanceRefreshId | [0]' --output text || echo "")
          if [[ -z "$refresh_id" || "$refresh_id" == "None" ]]; then
            echo "Initiating rolling instance refresh for ${asg}..."
            read -r lt_id lt_version < <(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$asg" --region "${{ env.AWS_REGION }}" --query 'AutoScalingGroups[0].LaunchTemplate.[LaunchTemplateId,Version]' --output text || true)
            if [[ -n "$lt_id" && -n "$lt_version" && "$lt_version" != "None" ]]; then
              desired=$(jq -cn --arg id "$lt_id" --arg version "$lt_version" '{LaunchTemplate:{LaunchTemplateId:$id,Version:$version}}')
              refresh_id=$(aws autoscaling start-instance-refresh \
                --auto-scaling-group-name "$asg" \
                --desired-configuration "$desired" \
                --preferences '{"MinHealthyPercentage": 50, "MaxHealthyPercentage": 150, "InstanceWarmup": 120, "SkipMatching": false, "AutoRollback": true}' \
                --region "${{ env.AWS_REGION }}" \
                --query 'InstanceRefreshId' --output text)
            else
              refresh_id=$(aws autoscaling start-instance-refresh \
                --auto-scaling-group-name "$asg" \
                --preferences '{"MinHealthyPercentage": 50, "MaxHealthyPercentage": 150, "InstanceWarmup": 120, "SkipMatching": false, "AutoRollback": false}' \
                --region "${{ env.AWS_REGION }}" \
                --query 'InstanceRefreshId' --output text)
            fi
          fi
          echo "Monitoring ${asg} refresh ${refresh_id}"
          echo "refresh_id=$refresh_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Auto Scaling refreshes to finish
        env:
          FRONTEND_REFRESH_ID: ${{ steps['refresh-frontend'].outputs.refresh_id }}
          BACKEND_REFRESH_ID: ${{ steps['refresh-backend'].outputs.refresh_id }}
        run: |
          set -euo pipefail
          refreshes=()
          if [ -n "$FRONTEND_REFRESH_ID" ]; then
            refreshes+=("${{ env.FRONTEND_ASG }}:$FRONTEND_REFRESH_ID")
          fi
          if [ -n "$BACKEND_REFRESH_ID" ]; then
            refreshes+=("${{ env.BACKEND_ASG }}:$BACKEND_REFRESH_ID")
          fi

          for attempt in {1..160}; do
            pending=0
            for refresh in "${refreshes[@]}"; do
              asg="${refresh%%:*}"
              refresh_id="${refresh#*:}"
              info=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "$asg" \
                --instance-refresh-ids "$refresh_id" \
                --region "${{ env.AWS_REGION }}" \
                --query 'InstanceRefreshes[0].[Status,PercentageComplete,StatusReason]' --output text || echo "Unknown 0 Unknown")
              read -r status pct reason <<< "$info"
              echo "[Attempt $attempt/160] $asg ($refresh_id): status=$status, progress=${pct:-0}%, reason=${reason:-none}"
              case "$status" in
                Successful) ;;
                Pending|InProgress|Baking|CheckpointDelay) pending=1 ;;
                *) echo "$asg instance refresh did not succeed (status: $status, reason: $reason)" >&2; exit 1 ;;
              esac
            done
            if [ "$pending" -eq 0 ]; then
              echo "All Auto Scaling instance refreshes completed successfully."
              break
            fi
            if [ "$attempt" -eq 160 ]; then
              echo "Timed out waiting for Auto Scaling instance refreshes after 40 minutes." >&2
              exit 1
            fi
            sleep 15
          done

      - name: Verify Live Production Readiness Checks
        run: |
          echo "Polling production domain readiness endpoints..."
          for i in {1..20}; do
            STATUS_FE=$(curl -s -o /dev/null -w "%{http_code}" https://codeskill.novaserve.cloud/health/ready || echo "000")
            STATUS_BE=$(curl -s -o /dev/null -w "%{http_code}" https://codeskill.novaserve.cloud/api/health/ready || echo "000")
            echo "Attempt $i: Frontend Readiness HTTP $STATUS_FE, Backend Readiness HTTP $STATUS_BE"
            if [ "$STATUS_FE" = "200" ] && [ "$STATUS_BE" = "200" ]; then
              echo "Both Frontend and Backend passed live readiness verification."
              exit 0
            fi
            sleep 15
          done
          echo "Live readiness verification did not return 200 within timeout." >&2
          exit 1

      - name: Verify Skill Development page is deployed
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'frontend' || github.event_name == 'push'
        run: |
          echo "Checking that the Skill Development page is served from production..."
          PAGE_CONTENT=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            "https://codeskill.novaserve.cloud/skill-development?deploy-check=${GITHUB_SHA}")
          if ! grep -q "Our Sincere Gratitude" <<< "$PAGE_CONTENT"; then
            echo "The production route responded but did not contain the Skill Development page content." >&2
            exit 1
          fi
          echo "Skill Development page is live."
