name: Build and Deploy to AWS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: codeskill-prod-files-reports
  ASG_NAME: codeskill-prod-asg

permissions:
  id-token: write # Required for configuring AWS Credentials via OIDC
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check AWS deployment configuration
        id: aws_auth
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: bash .github/scripts/check-aws-deployment-config.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install, Test, and Build Backend
        working-directory: ./backend-nestjs
        run: |
          npm install --legacy-peer-deps
          npm test
          npm run build
          npm run test:startup

      - name: Install, Test, and Build Frontend
        working-directory: ./frontend-v2
        run: |
          echo "NEXT_PUBLIC_API_URL=https://codeskill.novaserve.cloud/api" >> .env
          echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=968191151730-mglf3rq4pldoqqhhcrbqfbt9g2j9n8o6.apps.googleusercontent.com" >> .env
          npm install --legacy-peer-deps
          npm test
          npm run build

      - name: Package Application
        run: |
          # Create a deployment directory
          mkdir deploy_package

          # Copy PM2 Ecosystem configuration
          cp ecosystem.config.js deploy_package/
          
          # Copy Backend files
          mkdir -p deploy_package/backend-nestjs
          cp -r backend-nestjs/dist deploy_package/backend-nestjs/
          cp backend-nestjs/package.json deploy_package/backend-nestjs/
          cp backend-nestjs/package-lock.json deploy_package/backend-nestjs/
          
          # Copy Frontend files
          mkdir -p deploy_package/frontend-v2
          cp -r frontend-v2/.next deploy_package/frontend-v2/
          cp -r frontend-v2/public deploy_package/frontend-v2/
          cp frontend-v2/package.json deploy_package/frontend-v2/
          cp frontend-v2/package-lock.json deploy_package/frontend-v2/
          cp frontend-v2/next.config.js deploy_package/frontend-v2/ || true
          cp frontend-v2/next.config.mjs deploy_package/frontend-v2/ || true
          cp frontend-v2/next.config.ts deploy_package/frontend-v2/ || true

          # Zip the contents
          cd deploy_package
          zip -r ../latest.zip .

      - name: Configure AWS credentials through OIDC
        if: steps.aws_auth.outputs.auth_mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials through repository secrets
        if: steps.aws_auth.outputs.auth_mode == 'access_keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Build to S3
        run: |
          aws s3 cp latest.zip s3://${{ env.S3_BUCKET }}/releases/latest.zip

      - name: Trigger Auto Scaling Group Instance Refresh
        run: |
          # Check if an instance refresh is already running or pending
          ACTIVE_REFRESH=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name ${{ env.ASG_NAME }} \
            --query "InstanceRefreshes[?Status=='InProgress' || Status=='Pending'].InstanceRefreshId" \
            --output text)

          if [ -n "$ACTIVE_REFRESH" ] && [ "$ACTIVE_REFRESH" != "None" ]; then
            echo "Instance refresh ($ACTIVE_REFRESH) is currently in progress."
            echo "Cancelling it to deploy the latest build..."
            aws autoscaling cancel-instance-refresh \
              --auto-scaling-group-name ${{ env.ASG_NAME }} || true

            echo "Waiting for instance refresh cancellation..."
            for i in {1..30}; do
              CURRENT_STATUS=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name ${{ env.ASG_NAME }} \
                --query "InstanceRefreshes[?Status=='InProgress' || Status=='Pending' || Status=='Cancelling'].Status" \
                --output text)
              if [ -z "$CURRENT_STATUS" ]; then
                echo "Previous refresh successfully cancelled or completed."
                break
              fi
              echo "Waiting for previous refresh to finish cancelling (attempt $i/30)..."
              sleep 5
            done
          fi

          echo "Starting instance refresh for ${{ env.ASG_NAME }}..."
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ env.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 300}'
