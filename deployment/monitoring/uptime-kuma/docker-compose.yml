version: '3.8'

# ==============================================================================
# CodeSkill — Uptime Kuma Monitoring Stack
# Pinned version, low resource footprint (CPU 0.5, RAM 512MB), persistent storage
# ==============================================================================

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16-alpine
    container_name: codeskill-uptime-kuma
    restart: always
    environment:
      - UPTIME_KUMA_PORT=3001
      - NODE_ENV=production
    volumes:
      - kuma-data:/app/data
    ports:
      # Bound to localhost to prevent direct unauthenticated exposure to the public internet
      # Access via SSH tunnel (ssh -L 3001:localhost:3001) or protected reverse proxy
      - "127.0.0.1:3001:3001"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional lightweight WhatsApp Webhook Notification Relay
  whatsapp-relay:
    image: node:20-alpine
    container_name: codeskill-whatsapp-relay
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./whatsapp-relay.js:/app/whatsapp-relay.js:ro
    environment:
      - PORT=3002
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - RECIPIENT_PHONE_NUMBER=${RECIPIENT_PHONE_NUMBER:-}
    command: ["node", "whatsapp-relay.js"]
    ports:
      - "127.0.0.1:3002:3002"
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M

volumes:
  kuma-data:
    name: codeskill-uptime-kuma-data
