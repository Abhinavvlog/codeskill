global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    platform: 'codeskill'

rule_files:
  - 'alerts.yml'

remote_write:
  - url: https://prometheus-prod-43-prod-ap-south-1.grafana.net/api/prom/push
    basic_auth:
      username: '3666421'
      password: '<GRAFANA_CLOUD_API_TOKEN>'

scrape_configs:
  - job_name: 'codeskill-backend-api'
    scrape_interval: 10s
    metrics_path: '/api/metrics'
    static_configs:
      - targets:
          - '127.0.0.1:5001'
          - 'localhost:5001'
          - 'host.docker.internal:5001'
          - 'backend.codeskill.internal:5001'

  - job_name: 'postgres-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['127.0.0.1:9187']

  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'backend.codeskill.internal:9100'
          - 'piston.codeskill.internal:9100'

  - job_name: 'sandbox-containers-cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'piston.codeskill.internal:8080'
          - 'judge0.codeskill.internal:8080'
